# Builds the installable packages on every platform. A tag like v0.1.0
# publishes them as a GitHub release; running the workflow by hand only
# builds them, as artifacts of the run.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-26, target: macos }
          - { name: iOS, os: macos-26, target: ios }
          - { name: Windows, os: windows-latest, target: windows }
          - { name: Android, os: ubuntu-24.04, target: android }
          - { name: Linux, os: ubuntu-24.04, target: linux }
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          workspaces: . -> target

      # The Bern CLI keeps credentials in the Secret Service over D-Bus;
      # the Linux app also needs GTK, libadwaita and ALSA.
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev libasound2-dev pkg-config
          if [ "${{ matrix.target }}" = linux ]; then
            sudo apt-get install -y libgtk-4-dev libadwaita-1-dev
          fi

      # The simulator build, then the device build the .ipa holds.
      - name: iOS targets
        if: matrix.target == 'ios'
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim

      - name: Java
        if: matrix.target == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Gradle
        if: matrix.target == 'android'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.1"

      - name: Android SDK and NDK
        if: matrix.target == 'android'
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.0" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          rustup target add aarch64-linux-android

      # Without the secret the APK is signed with a debug key, which
      # cannot update an installed release.
      - name: Android signing key
        if: matrix.target == 'android'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/enji-release.jks"
            echo "BERN_ANDROID_KEYSTORE=$RUNNER_TEMP/enji-release.jks" >> "$GITHUB_ENV"
            echo "BERN_ANDROID_KEY_ALIAS=enji" >> "$GITHUB_ENV"
          fi

      # The build tool of the Bern Enji depends on (Cargo.toml).
      - name: Bern
        run: cargo install --locked --git https://github.com/AimesSoft/Bern --rev 1e2a01f04b669375b8a790da5abb1ab218e86061 bern-cli

      - name: Package
        if: runner.os != 'Windows'
        env:
          BERN_ANDROID_KEYSTORE_PASSWORD: ${{ matrix.target == 'android' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
        run: bern package --target ${{ matrix.target }}

      # From cmd, so the build fetches the Windows App SDK with Windows' own
      # tar: Git's, first on the bash path, reads "D:" as a host name. The
      # Rust cache brings back target\bern-winrt without all of the
      # packages in it, so they are fetched again.
      - name: Package
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          if exist target\bern-winrt rmdir /s /q target\bern-winrt
          bern package --target windows

      - uses: actions/upload-artifact@v4
        with:
          name: enji-${{ matrix.target }}
          path: target/bern/dist/*
          if-no-files-found: error

  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches the app version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Bern.toml | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Bern.toml says $version but the tag is $GITHUB_REF_NAME"
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # The store bundle (.aab) stays in the run's artifacts.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -f dist/*.aab
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Enji Music ${GITHUB_REF_NAME#v}" \
            --notes-file .github/release-notes.md
