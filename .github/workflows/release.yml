# Builds the installable packages on every platform. A tag like v0.1.0
# publishes them as a GitHub release; running the workflow by hand only
# builds them, as artifacts of the run.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-26, target: macos }
          - { name: Windows, os: windows-latest, target: windows }
          - { name: Android, os: ubuntu-24.04, target: android }
          - { name: Linux, os: ubuntu-24.04, target: linux }
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          workspaces: |
            . -> target
            vendor/bern -> target

      - name: Linux libraries
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev libasound2-dev libdbus-1-dev pkg-config

      - name: Java
        if: matrix.target == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Gradle
        if: matrix.target == 'android'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.1"

      - name: Android SDK and NDK
        if: matrix.target == 'android'
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          rustup target add aarch64-linux-android

      # Without the secret the APK is signed with a debug key, which
      # cannot update an installed release.
      - name: Android signing key
        if: matrix.target == 'android'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/enji-release.jks"
            echo "BERN_ANDROID_KEYSTORE=$RUNNER_TEMP/enji-release.jks" >> "$GITHUB_ENV"
          fi

      - name: Bern
        run: cargo build --manifest-path vendor/bern/Cargo.toml -p bern-cli --release

      - name: Package
        shell: bash
        env:
          BERN_ANDROID_KEYSTORE_PASSWORD: ${{ matrix.target == 'android' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          BERN_ANDROID_KEY_ALIAS: ${{ matrix.target == 'android' && secrets.ANDROID_KEY_ALIAS || '' }}
        run: vendor/bern/target/release/bern package --target ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: enji-${{ matrix.target }}
          path: target/bern/dist/*
          if-no-files-found: error

  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches the app version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Bern.toml | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Bern.toml says $version but the tag is $GITHUB_REF_NAME"
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # The store bundle (.aab) stays in the run's artifacts.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -f dist/*.aab
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Enji Music ${GITHUB_REF_NAME#v}" \
            --notes-file .github/release-notes.md
