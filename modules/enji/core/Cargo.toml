[package]
name = "enji-core"
description = "Enji Music: the engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
bern.workspace = true
enji-protocol.workspace = true
ncm-api-rs.workspace = true
tokio.workspace = true
enji-kit.workspace = true
serde_json.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
symphonia = { version = "0.5.5", default-features = false, features = ["aac", "isomp4", "mp3", "flac", "vorbis", "ogg", "wav", "pcm", "alac", "aiff"] }
rodio = { version = "0.20", default-features = false, features = ["symphonia-mp3", "symphonia-flac", "symphonia-aac", "symphonia-isomp4", "symphonia-vorbis", "symphonia-wav", "symphonia-alac", "symphonia-aiff"] }
qrcode = { version = "0.14", default-features = false }
png = "0.17"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "6"
lofty = "0.25.5"
sha1 = "0.11.0"
# Plugins: their packages.
zip = { version = "2", default-features = false, features = ["deflate"] }
rand = "0.8"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

# A USB DAC to itself: asked of the system's audio service, through Java.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"

# Apple Watch has no AudioToolbox; AVAudioEngine pulls samples from rodio's mixer.
[target.'cfg(target_os = "watchos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-avf-audio = { version = "0.3", default-features = false, features = [
    "std",
    "AVAudioEngine",
    "AVAudioFormat",
    "AVAudioMixerNode",
    "AVAudioMixing",
    "AVAudioNode",
    "AVAudioSession",
    "AVAudioSessionTypes",
    "AVAudioSourceNode",
    "AVAudioTypes",
    "block2",
    "objc2-core-audio-types",
] }
objc2-core-audio-types = "0.3"

[dev-dependencies]
# The tests run scripts, with no app to host them.
bern-script = { workspace = true, features = ["boa"] }
