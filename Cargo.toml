[workspace]
resolver = "3"
# Bern's own workspace: the framework the application builds with.
members = [
    "crates/enji-probe",
    "shell/protocol",
    "shell/core",
    "shell/ui",
    "modules/enji/protocol",
    "modules/enji/core",
    "modules/enji/ui",
    "modules/enji/kit",
    "modules/live/protocol",
    "modules/live/core",
    "modules/sung/protocol",
    "modules/sung/core",
    "modules/pulse/protocol",
    "modules/pulse/core",
    "modules/recommend/protocol",
    "modules/recommend/core",
    "modules/recommend/ui",
    "modules/charts/protocol",
    "modules/charts/core",
    "modules/charts/ui",
    "modules/search/protocol",
    "modules/search/core",
    "modules/search/ui",
]

[workspace.package]
version = "0.3.6"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/MCDFsteve/Enji"
publish = false

# The libraries that read tags, pictures and audio optimized in debug
# builds too: unoptimized, reading a large folder takes many times longer.
[profile.dev.package."*"]
opt-level = 3

[workspace.dependencies]
# Framework and build tool use the same immutable source commit.
bern = { git = "https://github.com/AimesSoft/Bern.git", rev = "59be35274dfc07ebc762fefb27aa4d7533497879" }
bern-script = { git = "https://github.com/AimesSoft/Bern.git", rev = "59be35274dfc07ebc762fefb27aa4d7533497879" }
enji-protocol = { path = "modules/enji/protocol" }
enji-kit = { path = "modules/enji/kit" }
live-protocol = { path = "modules/live/protocol" }
sung-protocol = { path = "modules/sung/protocol" }
pulse-protocol = { path = "modules/pulse/protocol" }
enji-ui = { path = "modules/enji/ui" }
ncm-api-rs = "0.1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
serde_json = "1"
anyhow = "1"
