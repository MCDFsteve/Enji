# Enji Music: a personal NetEase Cloud Music client.

[app]
id = "enji"
bundle_id = "com.mcdfsteve.enji"
version = "0.3.5"
name = { "zh-Hans" = "Enji Music", "en" = "Enji Music" }
# On iPhone the app's folder shows in the Files app: music put there is the
# local library.
files_folder = true
# Music plays on behind the lock screen and in the background, where
# the system's now playing shows it.
background_audio = true
# Desktop lyrics float over other apps (Android asks the user to allow it).
overlays = true
# A phone saves the sign-in QR code to its photos, for the NetEase app on it
# to scan from the album (iOS asks the user to allow it).
photos = true

# The equalizer (Fluent's device eq, MIT) in the accent: on macOS and iOS a
# Liquid Glass icon, white and black in the dark appearance; on Windows and
# Linux the glyph alone; on Android an adaptive icon the system can tint
# with the wallpaper's colours; elsewhere on a white plate. Drawn by
# design/icon/build.py and exported by design/icon/export.sh.
[app.icon]
default = "assets/icon/enji.png"
macos = "assets/icon/Enji.icon"
ios = "assets/icon/Enji.icon"
windows = "assets/icon/enji.ico"
linux = "assets/icon/hicolor"
android = "assets/icon/android/res"

[resources]
paths = ["assets/mark.png", "assets/cover-place.png", "assets/tray.svg"]

[languages]
supported = ["zh-Hans", "en"]
default = "zh-Hans"

# The shell assembles the modules: the window, its navigation and the
# choice of modules.
[protocol]
package = "enji-shell-protocol"
source = "shell/protocol/src/lib.rs"

[engine]
package = "enji-shell"
type = "enji_shell::ShellEngine"
path = "shell/core"

[ui]
package = "enji-shell-ui"
sources = "shell/ui/src"
root = "app"

# The core runs always; For You, Charts and Search can be switched off.
[[modules]]
path = "modules/enji"

[[modules]]
path = "modules/live"

[[modules]]
path = "modules/sung"

[[modules]]
path = "modules/pulse"

[[modules]]
path = "modules/recommend"

[[modules]]
path = "modules/charts"

[[modules]]
path = "modules/search"

# The switches of the optional modules join the settings' features.
[contributes]
feature_switches = ["module_switches"]

[layouts]
compact_below = 700
medium_below = 1024
expanded_below = 1440

[targets.macos]
platform = "macos"
javascript = true
channels = ["ipc"]

[targets.ios]
platform = "ios"
javascript = true
channels = ["ipc"]
# One package for iOS 16 and iOS 17 and later.
frontends = ["swiftui", "swiftui-16"]

[targets.tvos]
platform = "tvos"
javascript = true
channels = ["ipc"]

[targets.android]
platform = "android"
javascript = true
channels = ["ipc"]
android = { audio_settings = true }
# One APK for each, in a release.
abis = ["arm64-v8a", "armeabi-v7a", "x86_64"]

[targets.windows]
platform = "windows"
javascript = true
channels = ["ipc"]

[targets.linux]
platform = "linux"
javascript = true
channels = ["ipc"]
