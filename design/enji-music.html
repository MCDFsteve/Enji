<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Enji Music 设计稿</title>
<style>
:root {
  --ground: #FBFBFC;
  --side: #F2F2F4;
  --line: #E3E3E8;
  --card: #FFFFFF;
  --ink: #1C1C1E;
  --ink-2: #5E5E66;
  --ink-dim: #A3A3AB;
  --hover: #EAEAEE;
  --chip: #EEEEF1;
  --field: #E6E6EA;
  --border: #D6D6DC;
  --accent: #B94047;        /* 臙脂 */
  --accent-ink: #A3333B;
  --accent-deep: #8F2F36;
  --accent-tint: #F2DDDF;
  --accent-soft: #F6E7E8;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans", "Microsoft YaHei", sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--ground); color: var(--ink); font: 14px/1.45 var(--font); -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:disabled { cursor: default; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ell { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.clamp2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* device: the whole window on desktop, an iPhone-sized frame in phone mode.
   Everything below reacts to the device's size (container queries), not the window's. */
body { overflow: hidden; }
.device { position: relative; width: 100vw; height: 100vh; overflow: hidden; container: device / size; background: var(--ground); }
body.phone { background: #DCDCE2; display: grid; place-items: center; }
body.phone .device { width: auto; height: min(874px, calc(100vh - 56px)); aspect-ratio: 402 / 874; border-radius: 56px; box-shadow: 0 0 0 11px #1C1C1E, 0 0 0 12px #4A4A50, 0 40px 90px rgba(0,0,0,.28); }
.island { display: none; position: absolute; z-index: 30; top: 11px; left: 50%; width: 122px; height: 35px; margin-left: -61px; border-radius: 20px; background: #000; pointer-events: none; }
body.phone .island { display: block; }

/* layout switch: a review control that sits outside the app */
.layout-switch { position: fixed; z-index: 50; top: 12px; right: 16px; display: flex; gap: 2px; padding: 3px; border-radius: 999px; background: rgba(255,255,255,.76); -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%); box-shadow: 0 0 0 .5px rgba(0,0,0,.12), 0 4px 16px rgba(0,0,0,.1); }
.layout-switch button { height: 30px; padding: 0 12px 0 10px; border-radius: 999px; display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--ink-2); }
.layout-switch button[aria-pressed="true"] { background: var(--ink); color: #fff; }

/* iOS 26 pieces: Liquid Glass tab bar, search button, mini player, account button. Hidden on desktop. */
.phone-only { display: none !important; }
.glass { background: rgba(255,255,255,.62); -webkit-backdrop-filter: blur(24px) saturate(190%); backdrop-filter: blur(24px) saturate(190%); box-shadow: inset 0 0 0 .5px rgba(255,255,255,.8), 0 0 0 .5px rgba(0,0,0,.08), 0 10px 30px rgba(0,0,0,.12); }
.npmini { position: absolute; z-index: 5; left: 14px; right: 14px; bottom: 98px; height: 56px; border-radius: 28px; align-items: center; gap: 10px; padding: 0 6px 0 8px; }
.npmini .info { flex: 1; min-width: 0; display: block; }
.npmini .t { font-size: 14px; font-weight: 600; }
.npmini .a { font-size: 12px; color: var(--ink-2); }
.tabbar { position: absolute; z-index: 5; left: 14px; right: 90px; bottom: 26px; height: 64px; border-radius: 32px; padding: 4px; gap: 2px; }
.tabbar a { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 28px; font-size: 10px; font-weight: 600; }
.tabbar a { position: relative; z-index: 1; }
.tabbar a[aria-current="page"] { color: var(--accent); }
.tabpill { position: absolute; top: 4px; bottom: 4px; left: 0; width: 0; border-radius: 28px; background: rgba(0,0,0,.07); transform-origin: left center; pointer-events: none; opacity: 0; }
.searchtab { position: absolute; z-index: 5; right: 14px; bottom: 26px; width: 64px; height: 64px; border-radius: 50%; align-items: center; justify-content: center; }
.searchtab[aria-current="page"] { color: var(--accent); }
.avatar-btn { position: absolute; z-index: 4; top: 58px; right: 16px; width: 40px; height: 40px; border-radius: 50%; align-items: center; justify-content: center; }
.liblist { margin: 0 0 28px; padding: 0; list-style: none; }
.liblist a { display: flex; align-items: center; gap: 14px; min-height: 60px; padding: 6px 4px; border-bottom: 1px solid var(--line); }
.liblist .chev { margin-left: auto; color: var(--ink-dim); }
.libicon { width: 44px; height: 44px; flex: none; border-radius: 10px; display: grid; place-items: center; background: var(--accent-tint); color: var(--accent); }

/* shell */
.app { height: 100%; display: grid; grid-template-columns: 240px minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) 84px; }
.side { display: flex; flex-direction: column; gap: 2px; padding: 16px 12px 12px; background: var(--side); border-right: 1px solid var(--line); overflow-y: auto; }
.main { overflow-y: auto; padding: 0 40px 48px; }
.player { grid-column: 1 / -1; display: flex; align-items: center; gap: 24px; padding: 0 20px; background: rgba(255,255,255,0.92); border-top: 1px solid var(--line); }

/* sidebar */
.lights { display: flex; gap: 8px; padding: 2px 8px 22px; }
.lights i { width: 12px; height: 12px; border-radius: 50%; background: #FF5F57; }
.lights i:nth-child(2) { background: #FEBC2E; }
.lights i:nth-child(3) { background: #28C840; }
.field { display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 10px; margin-bottom: 14px; border-radius: 8px; background: var(--field); color: var(--ink-2); font-size: 13px; }
.field.on { background: #fff; box-shadow: 0 0 0 2px var(--accent); color: var(--accent-ink); font-weight: 600; }
.nav { display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border-radius: 8px; text-align: left; }
.nav:hover { background: var(--hover); }
.nav.on { background: var(--accent-tint); color: var(--accent-ink); font-weight: 600; }
.nav.pl { height: 40px; padding: 0 8px; }
.sec { display: flex; align-items: center; justify-content: space-between; padding: 20px 2px 6px 10px; font-size: 12px; font-weight: 600; color: var(--ink-2); }
.grow { flex: 1; min-height: 16px; }
.avatar { width: 28px; height: 28px; flex: none; border-radius: 50%; background: var(--accent); color: #fff; font-size: 13px; font-weight: 700; display: grid; place-items: center; }

/* covers: flat color + one glyph, standing in for artwork */
.cv { flex: none; display: flex; align-items: flex-end; padding: 0 0 .05em .2em; color: rgba(255,255,255,0.92); font-weight: 700; line-height: 1; }
.cv.c { align-items: center; justify-content: center; padding: 0; }
.art { position: relative; display: block; aspect-ratio: 1; border-radius: 12px; overflow: hidden; }
.art .glyph { position: absolute; left: 14px; bottom: 8px; font-size: 64px; font-weight: 700; line-height: 1; color: rgba(255,255,255,0.9); }
.plays { position: absolute; z-index: 3; top: 8px; right: 8px; display: flex; align-items: center; gap: 3px; padding: 2px 8px; border-radius: 999px; background: rgba(0,0,0,0.4); color: #fff; font-size: 12px; }
.cardplay { position: absolute; z-index: 3; right: 10px; bottom: 10px; width: 40px; height: 40px; border-radius: 50%; background: #fff; color: var(--accent); display: grid; place-items: center; opacity: 0; transition: opacity var(--d-snappy) var(--e-snappy); } /* reveal: hover */
.card { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.card:hover .cardplay, .card:focus-visible .cardplay { opacity: 1; }
.cardtitle { font-weight: 500; line-height: 1.4; }
.cardsub { font-size: 12px; color: var(--ink-2); margin-top: -4px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 28px 20px; }
.cards.lg { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); }
.people { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 28px 20px; }
.person { display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; font-weight: 500; }
.person .face { width: 100%; aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; color: rgba(255,255,255,0.92); font-size: 44px; font-weight: 700; }
.hit { color: var(--accent); }

/* type */
.topbar { height: 52px; display: flex; align-items: center; gap: 4px; }
.title { margin: 4px 0 20px; font-size: 32px; font-weight: 700; letter-spacing: -0.01em; }
.h2 { margin: 0 0 16px; font-size: 20px; font-weight: 700; }

/* controls */
.iconbtn { width: 40px; height: 40px; flex: none; border-radius: 8px; display: grid; place-items: center; }
.iconbtn:hover { background: var(--hover); }
.iconbtn.sm { width: 28px; height: 28px; border-radius: 6px; }
.iconbtn.nav-arrow { width: 32px; height: 32px; color: var(--ink-2); }
.iconbtn:disabled { color: #C7C7CC; background: none; }
.pill { height: 32px; padding: 0 14px; border-radius: 999px; background: var(--chip); font-size: 13px; font-weight: 500; }
.pill[aria-pressed="true"], .pill[aria-selected="true"] { background: var(--accent-tint); color: var(--accent-ink); }
.pill.dark[aria-selected="true"] { background: var(--ink); color: #fff; }
.pills { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { height: 40px; padding: 0 20px 0 16px; border-radius: 999px; display: inline-flex; align-items: center; gap: 6px; font-weight: 600; }
.btn.primary { background: var(--accent); color: #fff; }
.btn.primary:hover { background: var(--accent-deep); }
.btn.ghost { background: #fff; border: 1px solid var(--border); font-weight: 500; }
.btn.round { width: 40px; padding: 0; justify-content: center; }
.tabs { display: flex; gap: 28px; border-bottom: 1px solid var(--line); margin-bottom: 20px; }
.tab { height: 42px; margin-bottom: -1px; border-bottom: 2px solid transparent; font-size: 15px; color: var(--ink-2); }
.tab[aria-selected="true"] { border-color: var(--accent); color: var(--ink); font-weight: 600; }
/* Sliders drawn by hand: native ones render inconsistently (a dark box in Safari). --p is the filled share. */
input[type=range] { -webkit-appearance: none; appearance: none; height: 18px; margin: 0; background: transparent; cursor: pointer; --fill: var(--accent); --track: #D9D9DF; }
input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: linear-gradient(to right, var(--fill) var(--p, 50%), var(--track) var(--p, 50%)); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; margin-top: -4px; border-radius: 50%; background: var(--fill); box-shadow: 0 0 0 .5px rgba(0,0,0,.12); }
input[type=range]::-moz-range-track { height: 4px; border-radius: 2px; background: var(--track); }
input[type=range]::-moz-range-progress { height: 4px; border-radius: 2px; background: var(--fill); }
input[type=range]::-moz-range-thumb { width: 12px; height: 12px; border: 0; border-radius: 50%; background: var(--fill); }

/* home */
.hero { display: flex; flex-wrap: wrap; gap: 20px; margin-bottom: 40px; }
.daily { flex: 2 1 440px; min-height: 208px; display: flex; gap: 28px; padding: 24px; border-radius: 16px; background: var(--accent); color: #fff; }
.daily .date { display: flex; flex-direction: column; justify-content: space-between; }
.daily .day { font-size: 76px; font-weight: 700; line-height: 1; margin-top: 6px; letter-spacing: -0.02em; }
.daily ol { flex: 1; min-width: 0; margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; justify-content: center; gap: 12px; }
.daily li { display: flex; align-items: center; gap: 12px; min-width: 0; }
.daily .go { align-self: flex-end; width: 52px; height: 52px; flex: none; border-radius: 50%; background: #fff; color: var(--accent); display: grid; place-items: center; }
.fm { flex: 1 1 300px; min-height: 208px; display: flex; flex-direction: column; justify-content: space-between; gap: 16px; padding: 24px; border-radius: 16px; background: #26222A; color: #fff; }
.fm .ctl { width: 44px; height: 44px; border-radius: 50%; background: rgba(255,255,255,0.14); display: grid; place-items: center; }
.fm .ctl.lead { background: #fff; color: #26222A; }

/* charts */
.chart { border-radius: 14px; background: #fff; border: 1px solid var(--line); overflow: hidden; }
.chart header { display: flex; align-items: center; gap: 14px; padding: 16px; color: #fff; }
.chart ol { margin: 0; padding: 8px 8px 4px; list-style: none; }
.chart li { display: flex; align-items: center; gap: 12px; height: 48px; padding: 0 8px; border-radius: 8px; }
.chart li:hover { background: var(--hover); }
.rank { width: 18px; text-align: center; font-weight: 700; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.rank.top { color: var(--accent); }

/* playlist */
.plhead { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 28px; margin: 8px 0 28px; }
.plhead h1 { margin: 0; font-size: 40px; font-weight: 700; letter-spacing: -0.01em; }
.meta { display: flex; align-items: center; gap: 8px; margin-top: 12px; color: var(--ink-2); font-size: 13px; }
.notice { width: 100%; display: flex; align-items: center; gap: 10px; padding: 10px 14px; margin-bottom: 16px; border-radius: 10px; background: var(--accent-soft); color: var(--accent-deep); font-size: 13px; text-align: left; }
.trow { display: grid; grid-template-columns: 48px minmax(0, 1fr) minmax(0, 0.6fr) 52px 88px; align-items: center; padding-right: 12px; }
.thead { height: 36px; color: var(--ink-2); font-size: 12px; border-bottom: 1px solid var(--line); }
.tracks { margin: 6px 0 0; padding: 0; list-style: none; }
.tracks li { height: 60px; border-radius: 10px; }
.tracks li:hover { background: var(--hover); }
.tracks li.playing { background: #F8ECED; }
.num { padding-left: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.song { display: flex; align-items: center; gap: 12px; min-width: 0; }
.tag { flex: none; padding: 1px 6px; border-radius: 4px; font-size: 11px; font-weight: 600; background: #E8E8EC; color: var(--ink-2); }
.tag.warn { background: var(--accent-soft); color: var(--accent-deep); }
.sub { font-size: 12px; color: var(--ink-2); margin-top: 2px; }
.dur { display: flex; justify-content: flex-end; font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.dim .cv { opacity: .4; }
.dim .t, .dim .sub, .dim .num, .dim .alb { color: var(--ink-dim); }
.mini { height: 28px; padding: 0 10px; border-radius: 999px; font-size: 12px; font-weight: 600; border: 1px solid var(--accent); color: var(--accent); }
.mini.plain { border-color: var(--border); color: var(--ink); font-weight: 500; background: #fff; }

/* search */
.search { position: relative; max-width: 720px; margin: 0 0 20px; }
.search svg { position: absolute; left: 16px; top: 14px; color: var(--ink-2); }
.search input { width: 100%; height: 48px; padding: 0 48px; border: 1px solid var(--border); border-radius: 12px; background: #fff; color: var(--ink); font: inherit; font-size: 17px; }
.search input:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
.search input::-webkit-search-cancel-button { display: none; }
.search .clear { position: absolute; right: 6px; top: 6px; width: 36px; height: 36px; border-radius: 50%; color: var(--ink-2); display: grid; place-items: center; }
.best { position: relative; display: flex; flex-direction: column; gap: 18px; padding: 22px; border-radius: 16px; background: #fff; border: 1px solid var(--line); }
.best .cardplay { right: 22px; bottom: 22px; width: 48px; height: 48px; background: var(--accent); color: #fff; }
.best:hover .cardplay { opacity: 1; }
.srow { display: flex; align-items: center; gap: 12px; height: 58px; padding: 0 10px; border-radius: 10px; }
.srow:hover { background: var(--hover); }
.split { display: flex; flex-wrap: wrap; gap: 32px; margin-bottom: 40px; }
.empty { padding: 48px 0; color: var(--ink-2); font-size: 15px; }

/* player bar */
.pl-left, .pl-right { flex: 1 1 0; min-width: 0; display: flex; align-items: center; gap: 12px; }
.pl-right { justify-content: flex-end; gap: 4px; }
.pl-mid { flex: 0 1 520px; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.ctrls { display: flex; align-items: center; gap: 10px; }
.playbtn { width: 44px; height: 44px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; }
.playbtn:hover { background: var(--accent-deep); }
.progress { width: 100%; display: flex; align-items: center; gap: 10px; font-size: 11px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.progress input { flex: 1; min-width: 0; }
.quality { height: 22px; padding: 0 6px; margin-right: 6px; border: 1px solid var(--accent); border-radius: 5px; color: var(--accent); font-size: 11px; font-weight: 600; }
.ci { color: var(--ink-2); }
.liked { color: var(--accent); }
.lyricbtn { font-size: 16px; font-weight: 700; }

/* lyrics (full window) */
.lyrics { --deep: #14233E; position: absolute; inset: 0; z-index: 10; display: none; flex-direction: column; overflow: hidden; background: #16171F; color: #fff; }
.lyrics.open { display: flex; }
.lyrics .bg { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.lyrics .bg .bgart { position: absolute; inset: -15%; filter: blur(80px) saturate(1.3); opacity: .95; }
.lyrics .bg .scrim { position: absolute; inset: 0; background: rgba(10,14,24,.42); }
.artsvg { display: block; width: 100%; height: 100%; }
.artthumb { flex: none; display: block; overflow: hidden; }

/* Cover glow, ported from Misuzu's HoverGlowOverlay: a white radial light that follows the pointer or finger,
   radius = short side × data-glow, centre at base × 1, 55% at base × 0.2, added on top (plus blend), 180ms fade.
   --ga is the base: 0.4 on light pages (Misuzu), 0.22 on the dark now-playing page. */
[data-glow] { position: relative; overflow: hidden; }
.glowfx { position: absolute; inset: 0; z-index: 2; pointer-events: none; border-radius: inherit; opacity: 0; transition: opacity .18s ease;
  mix-blend-mode: screen; mix-blend-mode: plus-lighter;
  background: radial-gradient(circle var(--gr, 240px) at var(--gx, 50%) var(--gy, 50%),
    rgba(255,255,255,var(--ga, .4)) 0%, rgba(255,255,255,calc(var(--ga, .4) * .2)) 55%, rgba(255,255,255,0) 100%); }
.glowing > .glowfx { opacity: 1; }
.lyrics header { position: relative; height: 52px; flex: none; display: flex; align-items: center; gap: 20px; padding: 0 20px; }
.round-w { width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,0.14); display: grid; place-items: center; color: #fff; }
/* Sized from the device: the cover takes whatever height the controls leave, so the page never scrolls on desktop. */
.lbody { position: relative; flex: 1; min-height: 0; display: flex; gap: clamp(28px, 5cqw, 80px); padding: 0 clamp(24px, 5cqw, 80px) clamp(16px, 3.5cqh, 36px); overflow: hidden; }
.np { --cover: clamp(140px, calc(100cqh - 380px), 460px); flex: 0 0 clamp(300px, min(var(--cover), 38cqw), 460px); min-height: 0; display: flex; flex-direction: column; justify-content: center; gap: clamp(10px, 2.2cqh, 22px); }
.np .big { display: block; width: min(100%, var(--cover)); aspect-ratio: 1; flex: none; border-radius: clamp(10px, 1.6cqh, 18px); overflow: hidden; box-shadow: 0 24px 60px rgba(0,0,0,0.38); }
.np h1 { margin: 0; font-size: clamp(19px, 2.8cqh, 26px); line-height: 1.25; }
.np .by { margin-top: 4px; font-size: clamp(13px, 1.8cqh, 15px); color: rgba(255,255,255,.78); }
.wctl { border-radius: 50%; display: grid; place-items: center; color: #fff; }
.wctl.soft { color: rgba(255,255,255,0.78); }
.wplay { width: clamp(52px, 7.5cqh, 68px); height: clamp(52px, 7.5cqh, 68px); border-radius: 50%; background: #fff; color: #16171F; display: grid; place-items: center; }
.lyrics input[type=range] { --fill: #fff; --track: rgba(255,255,255,.26); }
.pane { flex: 1 1 0; min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: clamp(10px, 2cqh, 18px); }
.seg { display: flex; gap: 4px; padding: 4px; border-radius: 999px; background: rgba(255,255,255,0.12); }
.seg button { height: 32px; padding: 0 18px; border-radius: 999px; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.seg button[aria-selected="true"] { background: #fff; color: #16171F; }
.seg small { font-size: 11px; font-weight: 500; opacity: .8; }
.toggle { width: 36px; height: 36px; border-radius: 8px; background: rgba(255,255,255,0.08); font-size: 15px; font-weight: 700; }
.toggle[aria-pressed="true"] { background: rgba(255,255,255,0.24); }
.lines { position: relative; flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: none; display: flex; flex-direction: column; gap: clamp(12px, 3cqh, 30px); padding: 0;
  -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 12%, #000 74%, transparent 100%);
          mask-image: linear-gradient(to bottom, transparent 0, #000 12%, #000 74%, transparent 100%); }
.line .jp { font-size: clamp(20px, min(3.6cqh, 2.5cqw), 32px); font-weight: 700; line-height: 1.5; }
.line .zh { margin-top: 2px; font-size: clamp(13px, min(2cqh, 1.4cqw), 18px); font-weight: 500; }
.lines::-webkit-scrollbar { display: none; }
.lines::before, .lines::after { content: ""; flex: none; height: 40%; }
.line { transform-origin: left center; cursor: pointer; }
.line:not(.cur) .jp { color: rgba(255,255,255,.88); }
.line.cur .jp { font-weight: 800; }
.line.cur .zh { font-weight: 600; color: rgba(255,255,255,0.9); }

/* Phone layout (iOS 26): no sidebar or desktop player bar; floating glass tab bar and mini player instead. */
@container device (max-width: 760px) {

/* Phone now-playing: the artwork is the page. In the cover stage it runs full-bleed from the top edge
   and fades into the deep page colour; title, lyric preview and controls sit on the fade. Opening the
   lyrics (artwork, preview or toolbar) blurs the same artwork into the background behind the words. */
.thumb, .tools, .preview, .q, .heroart, .artzone { display: none; }
.panebody { flex: 1; min-height: 0; display: flex; flex-direction: column; }
@container device (max-width: 820px) {
  .lyrics { background: var(--deep); }
  .lyrics .bg { display: none; }
  .heroart { display: block; position: absolute; left: 0; right: 0; top: 0; height: 66%; overflow: hidden; pointer-events: none;
    transition: height var(--d-hero) var(--e-hero), transform var(--d-hero) var(--e-hero); } /* animate: hero */
  .heroart::after { content: ""; position: absolute; inset: 0;
    background: linear-gradient(to bottom, rgba(0,0,0,.26) 0, transparent 15%, transparent 50%, var(--deep) 98%); }
  .heroart::after { transition: opacity var(--d-smooth) var(--e-smooth); }
  /* The light is on the artwork: it fades out with it into the page instead of stopping at its edge. */
  .heroart .glowfx { -webkit-mask-image: linear-gradient(to bottom, #000 50%, transparent 98%); mask-image: linear-gradient(to bottom, #000 50%, transparent 98%); }
  .hsharp, .hblur { position: absolute; inset: 0; }
  /* The blurred backdrop is a second image (the core would hand over a pre-blurred copy); the stages cross-fade it. */
  .hblur { opacity: 0; filter: blur(28px) saturate(1.25) brightness(.62); transform: scale(1.15); transition: opacity var(--d-smooth) var(--e-smooth); }
  .hblur::after { content: ""; position: absolute; inset: 0; background: rgba(10,14,26,.3); }
  .lyrics:not(.st-cover) .heroart { height: 100%; }
  .lyrics:not(.st-cover) .heroart::after { opacity: 0; }
  .lyrics:not(.st-cover) .hblur { opacity: 1; }
  .lyrics header { z-index: 2; }
  .lyrics header .round-w { background: rgba(0,0,0,.24); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }

  .lbody { display: grid; grid-template-columns: minmax(0, 1fr);
    grid-template-rows: auto auto minmax(0, 1fr) auto auto auto;
    grid-template-areas: "song" "tabs" "pane" "progress" "transport" "tools";
    gap: 12px; padding: 0 22px 16px; overflow: hidden; }
  .np, .pane { display: contents; }
  .np .big, .np .volume, .seg, .songrow .addto { display: none !important; }
  .thumb { display: block; flex: none; border-radius: 8px; box-shadow: 0 6px 16px rgba(0,0,0,.3); }
  .songrow { grid-area: song; align-items: center !important; }
  .songrow h1 { font-size: 17px; }
  .songrow .by { font-size: 13px; margin-top: 2px; }
  .progress-w { grid-area: progress; }
  .transport { grid-area: transport; padding: 0 6px; }
  .tools { grid-area: tools; display: flex; justify-content: space-between; padding: 0 2px; }
  .tools .toggle { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: transparent; color: rgba(255,255,255,.72); }
  .tools .toggle[aria-pressed="true"] { background: rgba(255,255,255,.2); color: #fff; }
  .panehead { grid-area: tabs; justify-content: flex-end !important; }
  .panebody { grid-area: pane; }
  .lines { gap: 18px; }
  .line .jp { font-size: 22px; }
  .line .zh { font-size: 14px; }
  .wplay { width: 60px; height: 60px; }

  /* cover stage: everything below the artwork, left-aligned on the fade */
  .lyrics.st-cover .lbody { grid-template-rows: minmax(0, 1fr) auto auto auto auto auto;
    grid-template-areas: "art" "song" "preview" "progress" "transport" "tools"; gap: 14px; }
  .lyrics.st-cover .artzone { display: block; grid-area: art; }
  .lyrics.st-cover .thumb, .lyrics.st-cover .panehead, .lyrics.st-cover .panebody { display: none !important; }
  .lyrics.st-cover .songrow { align-items: flex-end !important; }
  .lyrics.st-cover .songrow h1 { font-size: 30px; line-height: 1.15; letter-spacing: -.01em; white-space: normal; text-shadow: 0 2px 18px rgba(0,0,0,.35); }
  .lyrics.st-cover .songrow .by { font-size: 15px; margin-top: 6px; color: rgba(255,255,255,.82); }
  .lyrics.st-cover .q { display: block; margin-top: 8px; }
  .lyrics.st-cover .preview { display: flex; grid-area: preview; flex-direction: column; align-items: flex-start; gap: 1px; text-align: left; }
  .preview .pjp { font-size: 21px; font-weight: 800; line-height: 1.55; }

}
/* ---------- Motion: style! states only. Entering a state uses its spring; leaving uses settle: jelly.
   Durations and curves come from Bern's spring tokens (computed in the script as --d-* / --e-*). ---------- */
.nav, .iconbtn, .wctl, .round-w, .toggle, .ctl, .searchtab, .avatar-btn, .btn, .pill, .tab, .playbtn, .wplay, .quality,
.mini, .wpill, .likebtn, .seg button, .tabbar a, .npmini, .daily, .fm, .card .art, .layout-switch button, .notice {
  transition: transform var(--d-jelly) var(--e-jelly), background-color .15s ease, color .15s ease, box-shadow var(--d-smooth) var(--e-smooth);
}
/* SidebarItem { hover: scale(1.03, snappy), pressed: scale(0.94, press), settle: jelly } */
.nav:hover { transform: scale(1.03); transition: transform var(--d-snappy) var(--e-snappy), background-color .15s ease; }
.nav:active { transform: scale(.94); transition: transform var(--d-press) var(--e-press); }
/* IconButton { hover: background(fill.subtle) + scale(1.08, snappy), pressed: scale(0.84, press), settle: jelly } */
:is(.iconbtn, .wctl, .round-w, .toggle, .ctl, .searchtab, .avatar-btn):not(:disabled):hover { transform: scale(1.08); transition: transform var(--d-snappy) var(--e-snappy), background-color .15s ease; }
:is(.iconbtn, .wctl, .round-w, .toggle, .ctl, .searchtab, .avatar-btn):not(:disabled):active { transform: scale(.84); transition: transform var(--d-press) var(--e-press); }
/* Button.hero { hover: scale(1.06, snappy), pressed: scale(x: 0.97, y: 0.90, press), settle: jelly } */
:is(.playbtn, .wplay, .btn.primary):hover { transform: scale(1.06); transition: transform var(--d-snappy) var(--e-snappy), background-color .15s ease; }
:is(.playbtn, .wplay, .btn, .quality, .mini, .npmini):active { transform: scale(.97, .9); transition: transform var(--d-press) var(--e-press); }
/* pills, tabs, segments: pressed: scale(0.94, press) */
:is(.pill, .tab, .wpill, .seg button, .likebtn, .tabbar a, .layout-switch button):active { transform: scale(.94); transition: transform var(--d-press) var(--e-press); }
/* Button.card { hover: scale(1.03, snappy) + shadow(14, y: 6, opacity: 0.18), pressed: scale(0.97, press), settle: jelly } */
.card:hover .art { transform: scale(1.03); box-shadow: 0 6px 28px rgba(0,0,0,.18); transition: transform var(--d-snappy) var(--e-snappy), box-shadow var(--d-snappy) var(--e-snappy); }
.card:active .art { transform: scale(.97); transition: transform var(--d-press) var(--e-press); }
/* Button.feature { hover: scale(1.015, snappy) + shadow(16, y: 8), pressed: scale(0.985, press), settle: jelly } */
:is(.daily, .fm):hover { transform: scale(1.015); box-shadow: 0 10px 32px rgba(0,0,0,.16); transition: transform var(--d-snappy) var(--e-snappy), box-shadow var(--d-snappy) var(--e-snappy); }
.daily:active { transform: scale(.985); transition: transform var(--d-press) var(--e-press); }
.notice:hover { transform: scale(1.01); transition: transform var(--d-snappy) var(--e-snappy); }
/* spin: app.playing, spin_period: 12 (stops where it is when paused) */
.spinwrap { display: block; border-radius: 50%; overflow: hidden; animation: enji-spin 12s linear infinite; animation-play-state: paused; }
.spinwrap.on { animation-play-state: running; }
@keyframes enji-spin { to { transform: rotate(1turn); } }
/* hero: the copy that travels between the two places */
.heroghost { position: fixed; z-index: 100; pointer-events: none; transform-origin: 0 0; }
.heroghost > * { width: 100% !important; height: 100% !important; margin: 0 !important; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: 0s !important; }
  .spinwrap { animation: none; }
}
.gone { display: none !important; }
</style>

const cv = (color, glyph, size, font, radius = 6, center = false, glow = "", attrs = "") =>
  `<span class="cv${center ? ' c' : ''}" aria-hidden="true"${attrs ? ' ' + attrs : ''}${glow ? ` data-glow="${glow}"` : ''} style="width:${size}px;height:${size}px;border-radius:${radius}px;background:${color};font-size:${font}px">${glyph}${glow ? '<i class="glowfx"></i>' : ''}</span>`;

// It fills any box (slice), so the same picture works as a thumbnail, a full-bleed hero and a blurred backdrop.
let artSeq = 0;
function artSvg() {
  const id = `enji-sky-${++artSeq}`;
  return `<svg class="artsvg" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B3160"/><stop offset=".42" stop-color="#585887"/><stop offset=".58" stop-color="#D9907C"/><stop offset=".65" stop-color="#F5C69B"/>
    </linearGradient></defs>
    <rect width="100" height="65" fill="url(#${id})"/>
    <circle cx="66" cy="59" r="10" fill="#FCE3C1"/>
    <rect y="63.5" width="100" height="36.5" fill="#1C3157"/>
    <g fill="#F5C69B"><rect x="56" y="66.5" width="20" height="1.3" rx=".65" opacity=".9"/><rect x="59.5" y="70.5" width="13" height="1.1" rx=".55" opacity=".75"/><rect x="62" y="74.5" width="8" height="1" rx=".5" opacity=".6"/><rect x="64" y="78.5" width="4" height=".9" rx=".45" opacity=".45"/></g>
    <g stroke="#3D5C8E" stroke-width=".7" stroke-linecap="round"><path d="M6 71h13M27 75h9M9 83h17M33 88h11M76 85h15M82 92h11"/></g>
    <g fill="#fff" opacity=".7"><circle cx="18" cy="16" r=".5"/><circle cx="35" cy="9" r=".4"/><circle cx="84" cy="13" r=".45"/><circle cx="91" cy="27" r=".35"/></g>
    <path d="M22 33q2.2-1.8 4.4 0q2.2-1.8 4.4 0" stroke="#F4D9C6" stroke-width=".8" fill="none" stroke-linecap="round"/>
  </svg>`;
}
const art = (size, radius = 6, attrs = '') =>
  `<span class="artthumb" aria-hidden="true"${attrs ? ' ' + attrs : ''} style="width:${size}px;height:${size}px;border-radius:${radius}px">${artSvg()}</span>`;
const cover = (title, color, glyph, size, font, radius = 6) =>
  title === NOW.title ? art(size, radius) : cv(color, glyph, size, font, radius);
const mark = (text) => {
  const q = S.q.trim();
  const i = q ? text.indexOf(q) : -1;
  return i < 0 ? text : `${text.slice(0, i)}<span class="hit">${q}</span>${text.slice(i + q.length)}`;
};
const card = (p, { href = '#playlist', sub = '', hl = false } = {}) => `
  <a href="${href}" class="card" data-key="${p.name}">
    <span class="art" data-glow="1" data-hero="poster" style="background:${p.color}">
      <span class="glyph" aria-hidden="true">${p.glyph}</span><i class="glowfx"></i>
      ${p.plays ? `<span class="plays">${I.tiny()}${p.plays}</span>` : ''}
      <span class="cardplay" aria-hidden="true">${I.play()}</span>
    </span>
    <span class="cardtitle clamp2">${hl ? mark(p.name) : p.name}</span>
    ${sub ? `<span class="cardsub">${sub}</span>` : ''}

const person = ([name, glyph, color], hl = false) => `
  <a href="#search" class="person" data-key="${name}"><span class="face" aria-hidden="true" style="background:${color}">${glyph}</span><span>${hl ? mark(name) : name}</span></a>`;
const topbar = (keep = false) => `

function results() {
  const q = S.q.trim();
  const has = (t) => !q || t.includes(q);
  const songs = sSongs.filter((s) => has(s[0]));
  const lists = sLists.filter((l) => has(l[0]));
  const arts = sArtists.filter((a) => has(a[0]));
  const albums = sAlbums.filter((a) => has(a[0]));
  if (!songs.length && !lists.length && !arts.length && !albums.length) return `<div class="empty">没有找到「${q}」</div>`;
  const songRow = ([t, a, al, time, g, c], big) => `
    <li class="srow" data-key="s-${t}">${cover(t, c, g, big ? 44 : 40, big ? 20 : 18, 6)}
      <span style="flex:1;min-width:0"><span class="ell" style="display:block;font-weight:500">${mark(t)}</span><span class="ell sub" style="display:block">${big ? a : `${a} · ${al}`}</span></span>
      ${big ? `<span class="ell wide sub" style="flex:0 1 220px;min-width:0;margin:0">${al}</span>` : ''}
      <span class="sub" style="width:44px;text-align:right;margin:0;font-variant-numeric:tabular-nums">${time}</span>
      <button class="iconbtn ci" aria-label="加入歌单">${I.plus(18)}</button>
    </li>`;
  const listCards = (sub) => lists.map(([n, g, c, cnt, owner]) => card({ name: n, glyph: g, color: c }, { hl: true, sub: sub ? `${cnt} 首 · ${owner}` : '' })).join('');

// ---------- motion ----------
// Only what Bern can declare: spring tokens, style! state transforms (CSS), appear + stagger, hero shared elements,
// animate (lengths), nudge, spin, reflow, and scroll-linked scale / opacity. Each piece names its Bern form.
const REDUCE = matchMedia('(prefers-reduced-motion: reduce)').matches;
const SPRINGS = { press: [0.12, 1], snappy: [0.22, 0.85], smooth: [0.45, 1], bouncy: [0.5, 0.62], jelly: [0.42, 0.42], hero: [0.48, 0.86] };
const M = {};
for (const [name, [T, z]] of Object.entries(SPRINGS)) {
  // Unit-mass spring as Bern defines the tokens: stiffness (2π/T)², damping 4πζ/T. Sampled into a CSS linear() curve.
  const w = 2 * Math.PI / T;
  const wd = w * Math.sqrt(Math.max(1e-6, 1 - z * z));
  const x = (t) => z >= 1 ? 1 - Math.exp(-w * t) * (1 + w * t)
    : 1 - Math.exp(-z * w * t) * (Math.cos(wd * t) + (z * w / wd) * Math.sin(wd * t));
  let end = 0.05;
  for (let t = 0; t < 3; t += 0.002) if (Math.abs(1 - x(t)) > 0.002) end = t;
  const pts = Array.from({ length: 49 }, (_, i) => (i === 48 ? 1 : x(end * i / 48)).toFixed(4));
  M[name] = { ms: Math.round(end * 1000), ease: `linear(${pts.join(', ')})` };
  document.documentElement.style.setProperty(`--d-${name}`, `${M[name].ms}ms`);
  document.documentElement.style.setProperty(`--e-${name}`, M[name].ease);
}

function play(el, frames, token = 'smooth', delay = 0) {
  if (!el || !el.animate) return null;
  if (REDUCE) return el.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 150, fill: 'backwards' }); // reduced motion: 150ms fade
  return el.animate(frames, { duration: M[token].ms, easing: M[token].ease, delay, fill: 'backwards' });
}
const RISE = [{ opacity: 0, transform: 'translateY(16px)' }, { opacity: 1, transform: 'none' }]; // transition rise: slide(bottom, 16, smooth)
const visible = (el) => !!el && el.getClientRects().length > 0;
const LISTS = '.cards, .people, .tracks, .liblist, .chartgrid';
function staggerChildren(list, step) { // ForEach(stagger: step) { … appear: rise }
  [...list.children].filter(visible).slice(0, 30).forEach((el, i) => play(el, RISE, 'smooth', 40 + i * step));
}
function enterPage() { // page: Column(stagger: 0.03) of blocks with appear: rise; lists stagger 0.04, rows 0.018
  const main = $('main');
  [...main.children].filter((el) => !el.matches('.topbar') && !el.matches(LISTS)).forEach((el, i) => play(el, RISE, 'smooth', i * 30));
  main.querySelectorAll(LISTS).forEach((l) => staggerChildren(l, l.matches('.tracks, .liblist') ? 18 : 40));
}
function enterLists() { $('main').querySelectorAll(LISTS).forEach((l) => staggerChildren(l, l.matches('.tracks, .liblist') ? 18 : 35)); }
function enterPane() {
  document.querySelectorAll('.lyrics .panebody .comment, .lyrics .panebody .facts, .lyrics .panebody .artistcard, .lyrics .panebody .lines')
    .forEach((el, i) => play(el, RISE, 'smooth', i * 35));
}
function enterStage() { // match on the phone stage: each branch's pieces appear: rise
  ['.lyrics .songrow', '.lyrics .preview', '.lyrics .panehead'].forEach((sel, i) => {
    const el = document.querySelector(sel);
    if (visible(el)) play(el, RISE, 'smooth', i * 40);
  });
  enterPane();
}
function nudge(el) { // nudge: grow a little, then spring back with jelly
  if (!el || REDUCE) return;
  el.animate([
    { transform: 'scale(1)', easing: 'cubic-bezier(.3,.7,.4,1)' },
    { transform: 'scale(1.28)', offset: 90 / (90 + M.jelly.ms), easing: M.jelly.ease },
    { transform: 'scale(1)' }
  ], { duration: 90 + M.jelly.ms });
}

// hero: a cover travels from where it was tapped to where it lands (card → playlist header, player bar ↔ lyrics cover).
let pendingHero = null;
const captureHero = (el, name) => ({ name, rect: el.getBoundingClientRect(), html: el.outerHTML });
document.addEventListener('click', (e) => {
  const link = e.target.closest('a, button');
  const src = e.target.closest('[data-hero]') || (link && link.querySelector('[data-hero]'));
  pendingHero = src ? captureHero(src, src.dataset.hero) : null;
}, true);
function flyHero() {
  const h = pendingHero;
  pendingHero = null;
  if (!h || REDUCE || !h.rect.width) return;
  const dst = [...document.querySelectorAll(`[data-hero-dst="${h.name}"]`)].find(visible);
  if (!dst) return;
  const to = dst.getBoundingClientRect();
  const ghost = document.createElement('div');
  ghost.className = 'heroghost';
  ghost.innerHTML = h.html;
  Object.assign(ghost.style, { left: `${h.rect.left}px`, top: `${h.rect.top}px`, width: `${h.rect.width}px`, height: `${h.rect.height}px` });
  document.body.appendChild(ghost);
  const move = `translate(${to.left - h.rect.left}px, ${to.top - h.rect.top}px) scale(${to.width / h.rect.width}, ${to.height / h.rect.height})`;
  const fly = ghost.animate([{ transform: 'none' }, { transform: move }], { duration: M.hero.ms, easing: M.hero.ease, fill: 'forwards' });
  ghost.animate([{ opacity: 1 }, { opacity: 1, offset: 0.6 }, { opacity: 0 }], { duration: M.hero.ms, fill: 'forwards' });
  dst.animate([{ opacity: 0 }, { opacity: 0, offset: 0.5 }, { opacity: 1 }], { duration: M.hero.ms }); // contents cross-fade
  fly.finished.then(() => ghost.remove());
}

const phoneLayout = () => getComputedStyle($('tabbar')).display !== 'none';
function openLyricsMotion() {
  const ly = $('lyrics');
  if (phoneLayout()) { pendingHero = null; play(ly, [{ transform: 'translateY(100%)' }, { transform: 'none' }], 'hero'); } // appear: slide(bottom, …, hero)
  else { play(ly, [{ opacity: 0 }, { opacity: 1 }], 'smooth'); flyHero(); } // appear: fade + hero: now
}
let closing = false;
function closeLyricsMotion() {
  if (closing) return;
  if (REDUCE) { location.hash = S.prev; return; }
  closing = true;
  const ly = $('lyrics');
  const phone = phoneLayout();
  const big = ly.querySelector('.np .big');
  pendingHero = !phone && visible(big) ? captureHero(big, 'bar') : null;
  const a = phone
    ? ly.animate([{ transform: 'none' }, { transform: 'translateY(100%)' }], { duration: Math.round(M.hero.ms * 0.8), easing: M.hero.ease, fill: 'forwards' }) // disappear: slide(bottom)
    : ly.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 200, easing: 'ease-out', fill: 'forwards' }); // disappear: fade
  a.finished.then(() => { location.hash = S.prev; requestAnimationFrame(() => { a.cancel(); closing = false; }); });
}

// spin: app.playing, spin_period: 12 — the disc keeps its angle across pauses and re-renders.
const spinAngle = () => (S.spinAcc + (S.playing ? (performance.now() - S.spinFrom) / 1000 : 0)) % 12;

// The system tab bar slides its selection from tab to tab; here the bouncy spring stands in for it.
let pillBox = null;
function placeTabPill() {
  const bar = $('tabbar');
  const pill = bar.querySelector('.tabpill');
  const cur = bar.querySelector('[aria-current="page"]');
  if (!pill) return;
  if (!cur || !visible(bar)) { pill.style.opacity = '0'; pillBox = null; return; }
  const box = { x: cur.offsetLeft, w: cur.offsetWidth };
  Object.assign(pill.style, { opacity: '1', width: `${box.w}px`, transform: `translateX(${box.x}px)` });
  if (pillBox && pillBox.x !== box.x && !REDUCE) {
    pill.animate([{ transform: `translateX(${pillBox.x}px) scaleX(${pillBox.w / box.w})` }, { transform: `translateX(${box.x}px)` }], { duration: M.bouncy.ms, easing: M.bouncy.ease });
  }
  pillBox = box;
}

// Lyrics: ScrollView(snap: center, position: draft.line); every line scroll_scale: 1.08, scroll_opacity: 0.3.
const linesBox = () => { const b = document.querySelector('.lyrics .lines'); return visible(b) ? b : null; };
function applyScrollLink() {
  const box = linesBox();
  if (!box) return;
  const r = box.getBoundingClientRect();
  const mid = r.top + r.height / 2, half = r.height / 2 || 1;
  box.querySelectorAll('.line').forEach((l) => {
    const lr = l.getBoundingClientRect();
    const d = Math.min(1, Math.abs(lr.top + lr.height / 2 - mid) / half);
    l.style.opacity = (0.3 + 0.7 * (1 - d)).toFixed(3);
    l.style.transform = REDUCE ? '' : `scale(${(1 + 0.08 * (1 - d)).toFixed(4)})`;
  });
}
function centerLine(smooth) {
  const box = linesBox();
  if (!box) return;
  const l = box.querySelectorAll('.line')[S.cur];
  if (!l) return;
  box.scrollTo({ top: l.offsetTop + l.offsetHeight / 2 - box.clientHeight / 2, behavior: smooth && !REDUCE ? 'smooth' : 'auto' });
  applyScrollLink();
}
function syncLyrics(smooth) {
  document.querySelectorAll('.lyrics .line').forEach((l, i) => l.classList.toggle('cur', i === S.cur));
  centerLine(smooth);
  const p = document.querySelector('.lyrics .preview');
  if (visible(p)) { // the preview's lines are keyed by line: disappear fade, appear slide(bottom, 10, smooth)
    p.innerHTML = previewInner();
    [...p.children].forEach((c, i) => play(c, [{ opacity: 0, transform: 'translateY(10px)' }, { opacity: 1, transform: 'none' }], 'smooth', i * 40));
  }
}
document.addEventListener('scroll', (e) => { if (e.target.classList && e.target.classList.contains('lines')) applyScrollLink(); }, true);
window.addEventListener('resize', () => centerLine(false));
setInterval(() => { // stand-in for playback time: the current line advances while playing
  if (!S.playing) return;
  S.cur = (S.cur + 1) % LINES.length;
  if (S.route === 'lyrics') syncLyrics(true);
}, 3600);

function reflow(container, html) { // reflow: smooth — items that stay glide to their new place; new ones appear: pop(0.94, snappy)
  const before = new Map([...container.querySelectorAll('[data-key]')].map((el) => [el.dataset.key, el.getBoundingClientRect()]));
  container.innerHTML = html;
  if (REDUCE) return;
  container.querySelectorAll('[data-key]').forEach((el) => {
    const o = before.get(el.dataset.key), n = el.getBoundingClientRect();
    if (!o) play(el, [{ opacity: 0, transform: 'scale(.94)' }, { opacity: 1, transform: 'none' }], 'snappy');
    else if (Math.abs(o.left - n.left) + Math.abs(o.top - n.top) > 1)
      el.animate([{ transform: `translate(${o.left - n.left}px, ${o.top - n.top}px)` }, { transform: 'none' }], { duration: M.smooth.ms, easing: M.smooth.ease });
  });
}

function afterAct(el) {
  const { act, key, val } = el.dataset;
  if (act === 'likeNow' && S.liked) document.querySelectorAll('[data-act="likeNow"]').forEach(nudge);
  if (act === 'like' && S.likes[val]) document.querySelectorAll(`[data-act="like"][data-val="${val}"]`).forEach(nudge);
  if (act === 'toggle') { // match on playing: the icon appears with pop(0.5, bouncy)
    document.querySelectorAll('[data-act="toggle"] svg').forEach((s) => play(s, [{ opacity: 0, transform: 'scale(.5)' }, { opacity: 1, transform: 'none' }], 'bouncy'));
  }
  if (act === 'set' && ['fTab', 'sTab', 'cat', 'region', 'kind'].includes(key)) enterLists();
  if (act === 'set' && (key === 'lTab' || key === 'sort')) enterPane();
  if (act === 'stage' || act === 'seek') enterStage();
  if (act === 'flip') {
    document.querySelectorAll(key === 'trans' ? '.lyrics .zh, .lyrics .pzh' : '.lyrics rt').forEach((z) => play(z, [{ opacity: 0 }, { opacity: 1 }], 'smooth'));
  }
}

// ---------- render & events ----------
const $ = (id) => document.getElementById(id);
const VIEWS = { home, featured, playlist, search: searchView, library };

function render({ keepScroll = true } = {}) {
  const main = $('main');
  const top = main.scrollTop;
  const at = S.route === 'lyrics' ? S.prev : S.route;
  $('side').innerHTML = side();
  main.innerHTML = (VIEWS[at] || home)();
  $('player').innerHTML = player();
  $('mini').innerHTML = mini();
  $('tabbar').innerHTML = tabbar();
  $('searchtab').innerHTML = I.search(22);
  if (at === 'search') $('searchtab').setAttribute('aria-current', 'page'); else $('searchtab').removeAttribute('aria-current');
  $('avatarBtn').classList.toggle('gone', !['home', 'featured', 'library'].includes(at));
  const open = S.route === 'lyrics';
  const ly = $('lyrics');
  ly.classList.toggle('open', open);
  ly.classList.toggle('st-cover', S.npStage === 'cover');
  if (!$('heroart').firstChild) $('heroart').innerHTML = `<div class="hsharp">${artSvg()}</div><div class="hblur">${artSvg()}</div><i class="glowfx"></i>`; // kept across renders so the stage change animates
  $('heroart').toggleAttribute('data-glow-area', S.npStage === 'cover'); // the sharp cover glows; the blurred backdrop behind the lyrics does not
  $('lyricsBody').innerHTML = open ? lyrics() : '';
  for (const id of ['app', 'avatarBtn', 'mini', 'tabbar', 'searchtab']) $(id).inert = open;
  main.scrollTop = keepScroll ? top : 0;
  if (open) requestAnimationFrame(() => centerLine(false));
  requestAnimationFrame(placeTabPill);
}

// Desktop window or iPhone frame; remembered per browser.
function setLayout(mode) {
  document.body.classList.toggle('phone', mode === 'phone');
  document.querySelectorAll('[data-layout]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.layout === mode)));
  try { localStorage.setItem('enji-layout', mode); } catch (e) { /* storage unavailable */ }
}
let savedLayout = 'desktop';
try { savedLayout = localStorage.getItem('enji-layout') || 'desktop'; } catch (e) { /* storage unavailable */ }
setLayout(savedLayout);
document.querySelector('.layout-switch').addEventListener('click', (e) => {
  const b = e.target.closest('[data-layout]');
  if (b) setLayout(b.dataset.layout);
});

function route() {
  const r = location.hash.slice(1) || 'home';
  const from = S.route;
  if (r !== 'lyrics') S.prev = r;
  S.route = r;
  render({ keepScroll: false });
  if (r === 'lyrics') {
    $('lyrics').querySelector('[data-act="closeLyrics"]').focus();
    if (from !== 'lyrics') openLyricsMotion();
  } else if (from === 'lyrics') {
    flyHero();
  } else if (from !== r) {
    enterPage();
    flyHero();
  }
}

const ACT = {
  set: (el) => { S[el.dataset.key] = el.dataset.val; },
  flip: (el) => { S[el.dataset.key] = !S[el.dataset.key]; },
  toggle: () => {
    const now = performance.now();
    if (S.playing) S.spinAcc += (now - S.spinFrom) / 1000; else S.spinFrom = now;
    S.playing = !S.playing;
  },
  likeNow: () => { S.liked = !S.liked; },
  like: (el) => { S.likes[el.dataset.val] = !S.likes[el.dataset.val]; },
  back: () => { history.back(); return 'skip'; },
  closeLyrics: () => { closeLyricsMotion(); return 'skip'; },
  seek: (el) => {
    const i = +el.dataset.val;
    if (i === S.cur && phoneLayout()) { S.npStage = 'cover'; return; }
    S.cur = i;
    syncLyrics(true);
    return 'skip';
  },
  toRemoved: () => { $('removed')?.scrollIntoView({ behavior: 'smooth', block: 'center' }); return 'skip'; },
  clearQ: () => { S.q = ''; },
  stage: (el) => {
    const v = el.dataset.val;
    if (v === 'cover' || S.npStage === v) { S.npStage = 'cover'; return; }
    S.npStage = v;
    S.lTab = v;
  }
};

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el || !ACT[el.dataset.act]) return;
  if (ACT[el.dataset.act](el) === 'skip') return;
  render();
  if (el.dataset.act === 'clearQ') $('q').focus();
  afterAct(el);
});

document.addEventListener('input', (e) => {
  const t = e.target;
  if (t.type === 'range') t.style.setProperty('--p', `${(t.value - t.min) / (t.max - t.min) * 100}%`);
  if (t.id !== 'q') return;
  S.q = e.target.value;
  reflow($('results'), results());
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && S.route === 'lyrics') closeLyricsMotion();
});

// Cover glow: lights up under the mouse (hover) or a finger (while pressed), like Misuzu.
let glowEl = null;
const glowTarget = (el) => {
  const g = el && el.closest ? el.closest('[data-glow], [data-glow-for]') : null;
  return g && g.dataset.glowFor ? $(g.dataset.glowFor) : g;
};
function setGlow(target) {
  if (target === glowEl) return;
  if (glowEl) glowEl.classList.remove('glowing');
  glowEl = target;
  if (glowEl) glowEl.classList.add('glowing');
}
// A cover with other content on top of it (phone cover stage: header, title and lyric preview sit on its fade)
// lights up wherever the pointer is inside it, not only where the cover is the topmost element.
const glowArea = (x, y) => [...document.querySelectorAll('[data-glow-area]')].find((g) => {
  const r = g.getBoundingClientRect();
  return r.width > 0 && x >= r.left && x < r.right && y >= r.top && y < r.bottom;
}) || null;
function moveGlow(e) {
  const t = glowTarget(e.target) || glowArea(e.clientX, e.clientY);
  if (e.pointerType !== 'mouse' && e.type === 'pointermove' && !e.buttons) return; // finger lifted
  setGlow(t);
  if (!t) return;
  const r = t.getBoundingClientRect();
  t.style.setProperty('--gx', `${e.clientX - r.left}px`);
  t.style.setProperty('--gy', `${e.clientY - r.top}px`);
  t.style.setProperty('--gr', `${Math.min(r.width, r.height) * (parseFloat(t.dataset.glow) || 1)}px`);
  if (t.dataset.glowAlpha) t.style.setProperty('--ga', t.dataset.glowAlpha);
}
document.addEventListener('pointermove', moveGlow);
document.addEventListener('pointerdown', moveGlow);
const endTouchGlow = (e) => { if (e.pointerType !== 'mouse') setGlow(null); };
document.addEventListener('pointerup', endTouchGlow);
document.addEventListener('pointercancel', endTouchGlow);
document.documentElement.addEventListener('pointerleave', () => setGlow(null));

window.addEventListener('hashchange', route);
route();
</script>
